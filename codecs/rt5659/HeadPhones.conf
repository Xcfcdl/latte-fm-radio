SectionDevice."Headphones" {
    Comment "Headphones"

    ConflictingDevice []

    Value {
        PlaybackPriority 200
        # 依附于耳机插孔：未插入时 WirePlumber 灰显本设备
        JackControl "Headphone Jack"
        PlaybackPCM "hw:${CardId}"
        PlaybackMixerElem "DAC1"
    }

    EnableSequence [
        # DAC → 耳机功放这一段 DAPM 自己接不上，必须显式路由，
        # 否则 HPOL/HPOR 始终 Off（通路断在 DAC1 MIXL 与 HP Amp 之间）。
        cset "name='DAC L1 Mux' 'IF1 DAC1'"
        cset "name='DAC R1 Mux' 'IF1 DAC1'"
        cset "name='DAC1 MIXL DAC1 Switch' on"
        cset "name='DAC1 MIXR DAC1 Switch' on"
        cset "name='Stereo DAC MIXL DAC L1 Switch' on"
        cset "name='Stereo DAC MIXR DAC R1 Switch' on"
        cset "name='DAC L1 Source' 'Stereo DAC Mixer'"
        cset "name='DAC R1 Source' 'Stereo DAC Mixer'"
        cset "name='Headphone Playback Volume' 19,19"
        cset "name='HPO L Playback Switch' on"
        cset "name='HPO R Playback Switch' on"
        cset "name='Headphone Switch' on"
    ]

    DisableSequence [
        cset "name='HPO L Playback Switch' off"
        cset "name='HPO R Playback Switch' off"
        cset "name='Headphone Switch' off"
    ]
}
