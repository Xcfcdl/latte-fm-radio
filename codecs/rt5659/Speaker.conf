SectionDevice."Speaker" {
    Comment "Speaker"

    ConflictingDevice []

    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId}"
        PlaybackMixerElem "DAC1"
    }

    EnableSequence [
        # 扬声器功放（两颗 TFA9890）的供电：板驱动把功放 OUT pin 暴露成
        # 'Speaker Amp Switch'，这里按输出选择直接打开。耳机孔兼作 FM 天线，
        # 会长期插着耳机却仍要求从喇叭放音，所以功放不能跟随插孔。
        cset "name='Speaker Amp Switch' on"
        # rt5659 AIF2TX 是两颗功放唯一的音频入口，数据源选 DAC_REF。
        cset "name='IF2 ADC Mux' DAC_REF"
    ]

    DisableSequence [
        # 先置数字静音再断电，避免切换瞬间功放把残留数据放出来。
        cset "name='IF2 ADC Mux' IF_ADC2"
        cset "name='Speaker Amp Switch' off"
    ]
}
